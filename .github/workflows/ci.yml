name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest -q

      - name: Run fixture benchmark
        run: python benchmark/run_benchmark.py

      - name: Enable unprivileged user namespaces for bwrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Run self-test
        run: python main.py --self-test || (cat reports/*.md; exit 1)

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.python-version }}
          path: reports/

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the action on the sample project
        id: qa
        uses: ./
        with:
          project: examples/sample-project
          docs: examples/sample-project/docs
          allow-sysctl-userns: "true"
      - name: Check verdict
        run: test "${{ steps.qa.outputs.verdict }}" = "CLEAR"

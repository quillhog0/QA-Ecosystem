# QA agent ecosystem — defaults are safe.
dry_run: true
allow_network: false
max_iterations: 2
keep_isolated_copy: false
model: openai/gpt-4o-mini
reports_dir: reports

nova:
  install_deps: true
  pip_timeout: 300

llm:
  # none | openrouter | local
  provider: none
  model: openai/gpt-4o-mini
  call_in_dry_run: false
  timeout_seconds: 45
  # base_url: http://127.0.0.1:11434/v1

pytest:
  timeout_seconds: 120

sable:
  allow_in_tests:
    - path: tests/unit/test_isolation.py
      call: subprocess.run
      reason: git worktree fixture
    - path: tests/unit/test_self_test_cli.py
      call: subprocess.run
      reason: CLI self-test
    - path: tests/unit/test_deps.py
      call: subprocess.run
      reason: venv creation and pip install verification

lexi:
  doc_globs:
    - "**/*.md"
    - "**/*.rst"
  ignore_identifiers:
    - OPENROUTER_API_KEY
    - LOCAL_LLM_API_KEY
    - DOMAIN_EXPERT
    - Vesper
    - Lexi
    - Aria
    - Riley
    - Sable
    - Nova

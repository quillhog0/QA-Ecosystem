# QA agent ecosystem — defaults are safe.
dry_run: true
allow_network: false
max_iterations: 2
keep_isolated_copy: false
model: openai/gpt-4o-mini
reports_dir: reports

sandbox:
  mode: auto

mutation:
  enabled: false
  min_score: 0.0
  max_mutants: 30
  timeout_per_mutant: 30
  seed: 42
  # Parallel mutant workers (operator only). Default min(4, cpu_count), hard cap 16.
  workers: 4

nova:
  install_deps: true
  pip_timeout: 300

riley:
  veto_on_uncovered_claims: false

llm:
  # none | openrouter | local
  provider: none
  model: openai/gpt-4o-mini
  call_in_dry_run: false
  timeout_seconds: 45
  # Lets only the QA process reach the provider. The tested project's pytest
  # run stays offline; that is governed separately by top-level allow_network.
  allow_network: false
  # base_url: http://127.0.0.1:11434/v1

pytest:
  timeout_seconds: 120

# Operator-owned exception policy (see docs/exceptions.md). Exceptions never
# live in the project under test. By default the file is
# exceptions/<project-name>.yaml under this repository; `file` overrides it and
# `max_days` caps how far ahead an expiry may sit.
exceptions:
  # file: exceptions/my-project.yaml
  dir: exceptions
  max_days: 90

sable:
  allow_in_tests:
    - path: tests/unit/test_isolation.py
      call: subprocess.run
      reason: git worktree fixture
    - path: tests/unit/test_self_test_cli.py
      call: subprocess.run
      reason: CLI self-test
    - path: tests/unit/test_deps.py
      call: subprocess.run
      reason: venv creation and pip install verification
    - path: tests/unit/test_runner.py
      call: subprocess.TimeoutExpired
      reason: simulated pytest timeout (no process spawned)
    - path: core/isolation.py
      call: shutil.rmtree
      reason: cleanup isolated copy
    - path: core/mutation.py
      call: shutil.rmtree
      reason: cleanup mutant workspace
    - path: core/deps.py
      call: shutil.rmtree
      reason: cleanup reusable virtualenv cache copy
    - path: main.py
      call: shutil.rmtree
      reason: cleanup self-test temp docs

lexi:
  doc_globs:
    - "**/*.md"
    - "**/*.rst"
  ignore_identifiers:
    - OPENROUTER_API_KEY
    - LOCAL_LLM_API_KEY
    - DOMAIN_EXPERT
    - Vesper
    - Lexi
    - Aria
    - Riley
    - Sable
    - Nova

# Field-test manifest: public repositories pinned to an exact commit.
#
# Every entry is cloned shallow at `sha` (see benchmark/field_test.py). The
# clone is the only network step in the whole survey and it happens in the
# harness, outside the QA run; each main.py invocation keeps allow_network=false
# and never builds or installs the project under test.
#
# `docs` is the documentation file handed to main.py --docs. Repos without an
# explicit entry fall back to README.md, then README.rst, then README.txt.
#
# To move a pin: clone/fetch the new commit, record `git rev-parse HEAD` here,
# and refresh benchmark/field_expected.yaml from a real run.
repos:
  - name: attrs
    url: https://github.com/python-attrs/attrs.git
    sha: c8bb9bfaa2843e7844b5bb13bed4370b51feec4f
    docs: README.md
